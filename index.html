<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OWAIS FITNESS — Membership Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #05070D;
    --surface: #0B1530;
    --surface-raised: #10214A;
    --surface-glow: #132B5E;
    --navy-deep: #021859;
    --navy: #062A77;
    --chalk: #F4F7FF;
    --chalk-dim: #A7B5D6;
    --gold: #F7A91E;
    --gold-bright: #FFBF3E;
    --cyan: #A0D9E9;
    --red: #F0443E;
    --hairline: #1E3C73;
    --shadow: 0 18px 45px rgba(0, 0, 0, .38);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -5%, rgba(247,169,30,.18), transparent 34%),
      radial-gradient(circle at 5% 25%, rgba(160,217,233,.08), transparent 28%),
      var(--bg);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 26px 18px 44px; }
  .header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 0 2px;
  }
  .logo {
    width: 104px;
    height: 104px;
    object-fit: contain;
    border-radius: 24px;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 12px 22px rgba(0,0,0,.34));
  }
  .gymname { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.08em; color: var(--chalk); }
  .tagline { font-size: 12px; color: var(--cyan); margin-top: 3px; letter-spacing: .03em; }
  .tabs {
    display: flex;
    gap: 5px;
    margin-top: 24px;
    background: rgba(11,21,48,.86);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 5px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--chalk-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: .18s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--navy), var(--navy-deep));
    color: var(--gold-bright);
    box-shadow: inset 0 0 0 1px rgba(247,169,30,.18);
  }
  input, button { font-family: inherit; }
  input {
    background: rgba(5,7,13,.78);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 11px 12px;
    color: var(--chalk);
    font-size: 14px;
    outline: none;
    width: 100%;
    transition: .18s ease;
  }
  input::placeholder { color: #7181A3; }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(247,169,30,.12); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  label {
    display: flex;
    flex-direction: column;
    gap: 7px;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 13px;
    font-weight: 600;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #101520;
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(247,169,30,.18);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 11px 24px rgba(247,169,30,.25); }
  .btn-primary:disabled { opacity: .6; cursor: wait; transform: none; }
  .btn-secondary {
    background: linear-gradient(135deg, rgba(16,33,74,.95), rgba(11,21,48,.95));
    color: var(--chalk);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: .16s ease;
  }
  .btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }
  .card {
    background: linear-gradient(145deg, rgba(16,33,74,.96), rgba(7,16,37,.98));
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 22px;
    margin-top: 20px;
    box-shadow: var(--shadow);
  }
  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .memberName { font-family: 'Oswald', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: .03em; }
  .memberPlan { font-size: 13px; color: var(--cyan); margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
    letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; border: 1px solid; }
  .gaugeWrap {
    display: flex;
    justify-content: center;
    margin: 20px 0 16px;
    padding: 8px 0 2px;
  }
  .datesRow { display: flex; border-top: 1px solid var(--hairline); padding-top: 15px; font-size: 13px; }
  .datesRow > div { flex: 1; }
  .dimLabel { color: var(--chalk-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .memberList { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .memberRow {
    background: rgba(11,21,48,.9);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 13px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .muted { color: var(--chalk-dim); font-size: 13px; text-align: center; line-height: 1.55; }
  .note { font-size: 11px; color: var(--chalk-dim); margin-top: 10px; line-height: 1.5; }
  .errorText { color: #FF7B72; font-size: 12px; margin-top: 8px; }
  .spinner { text-align: center; color: var(--chalk-dim); font-size: 13px; padding: 30px 0; }
  .portal-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--hairline), transparent);
    margin: 18px 0 6px;
  }

  .dashboardGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:12px; }
  .statCard { background:linear-gradient(145deg,rgba(16,33,74,.96),rgba(7,16,37,.98)); border:1px solid var(--hairline); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
  .statLabel { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--chalk-dim); }
  .statValue { font-family:'Oswald',sans-serif; font-size:26px; margin-top:3px; color:var(--chalk); }
  .statSub { font-size:10px; color:var(--chalk-dim); margin-top:2px; }
  .adminTools { margin-top:14px; padding:12px; border:1px solid var(--hairline); background:rgba(11,21,48,.78); border-radius:14px; }
  .filterBar { display:flex; gap:6px; margin-top:9px; overflow:auto; padding-bottom:2px; }
  .filterBtn { border:1px solid var(--hairline); color:var(--chalk-dim); background:rgba(5,7,13,.58); border-radius:999px; padding:7px 11px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .filterBtn.active { color:#101520; border-color:var(--gold); background:var(--gold); }
  .memberRow { flex-wrap:wrap; }
  .memberMeta { min-width:0; flex:1 1 180px; }
  .memberActions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .btn-mini { padding:8px 10px; font-size:11px; }
  .btn-renew { color:#101520; background:linear-gradient(135deg,var(--cyan),#6ec8df); border-color:transparent; }
  .btn-danger:hover { color:#fff !important; border-color:var(--red) !important; background:rgba(240,68,62,.1); }
  .emptyState { text-align:center; padding:24px 12px; color:var(--chalk-dim); border:1px dashed var(--hairline); border-radius:12px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(18px); background:#0B1530; border:1px solid var(--gold); color:var(--chalk); padding:11px 15px; border-radius:999px; box-shadow:0 15px 35px rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:.22s ease; z-index:50; font-size:12px; }
  .toast.error { border-color:var(--red); color:#ffd7d5; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .sectionTitle { font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:.04em; margin:20px 0 8px; }
  .miniLine { font-size:11px; color:var(--chalk-dim); line-height:1.45; }
  @media (max-width: 520px) { .memberActions { width:100%; justify-content:flex-start; } }
  @media (max-width: 420px) {
    .wrap { padding-left: 14px; padding-right: 14px; }
    .logo { width: 92px; height: 92px; }
    .gymname { font-size: 23px; }
    .card { padding: 18px; }
    .memberRow { align-items: flex-start; }
  }

</style>
</head>

function uid() { return Math.random().toString(36).slice(2, 10); }
function cleanPhone(p) { return (p || "").replace(/\D/g, ""); }
function fmtDate(d) { return new Date(d).toLocaleDateString("en-US", { day: "2-digit", month: "short", year: "numeric" }); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function statusOf(endDate) {
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(endDate);
  const daysLeft = daysBetween(today, end);
  if (daysLeft < 0) return { label: "Expired", tone: "var(--red)", daysLeft };
  if (daysLeft <= 5) return { label: "Expiring soon", tone: "var(--gold)", daysLeft };
  return { label: "Active", tone: "var(--cyan)", daysLeft };
}

function plateGaugeSVG(pct, tone, daysLeft) {
  const size = 168, stroke = 16, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  const offset = c * (1 - clamped);
  let holes = "";
  [0,60,120,180,240,300].forEach(deg => {
    const rad = deg * Math.PI / 180;
    const bx = size/2 + (r - stroke/2 - 4) * Math.cos(rad);
    const by = size/2 + (r - stroke/2 - 4) * Math.sin(rad);
    holes += `<circle cx="${bx}" cy="${by}" r="1.6" fill="var(--bg)" opacity="0.5" />`;
  });
  return `
  <div style="position:relative;width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--hairline)" stroke-width="${stroke}" />
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${tone}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s ease" />
      ${holes}
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="font-family:'Oswald',sans-serif;font-size:34px;font-weight:600;color:var(--chalk);line-height:1;">${daysLeft < 0 ? 0 : daysLeft}</div>
      <div style="font-size:10px;letter-spacing:0.12em;color:var(--chalk-dim);text-transform:uppercase;margin-top:4px;">days left</div>
    </div>
  </div>`;
}

function memberCardHTML(m) {
  const s = statusOf(m.endDate);
  // Membership status is driven by the expiry date only.
  // startDate is kept internally only for backward compatibility with older records.
  const daysPct = Math.max(0, Math.min(1, s.daysLeft / 30));
  return `
  <div class="card">
    <div class="row">
      <div>
        <div class="memberName">${m.name}</div>
        <div class="memberPlan">${m.plan}</div>
      </div>
      <span class="badge" style="color:${s.tone};border-color:${s.tone};">${s.label}</span>
    </div>
    <div class="gaugeWrap">${plateGaugeSVG(daysPct, s.tone, s.daysLeft)}</div>
    <div class="datesRow">
      <div style="flex:1;"><div class="dimLabel">Membership ends</div><div style="margin-top:2px;font-weight:600;">${fmtDate(m.endDate)}</div></div>
    </div>
  </div>`;
}

// ---------- ADMIN TAB ----------
let adminUnlocked = false;
let adminMembers = [];
let adminFilter = "all";
let adminSearch = "";

function todayISO() {
  const d = new Date(); d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function showToast(message, type = "success") {
  const t = document.getElementById("toast"); if (!t) return;
  t.textContent = message;
  t.classList.toggle("error", type === "error");
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    t.classList.remove("show", "error");
  }, type === "error" ? 7000 : 2600);
}
function firestoreErrorMessage(action, err) {
  const code = String(err?.code || "").replace(/^firestore\//, "");
  const detail = err?.message ? ` ${err.message}` : "";
  if (code === "permission-denied") {
    return `${action} was blocked by Firestore rules (permission-denied). This portal writes directly to members without Firebase Authentication; check the deployed members rules.${detail}`;
  }
  if (code === "unauthenticated") {
    return `${action} requires Firebase Authentication. This portal currently writes directly to Firestore.${detail}`;
  }
  if (code === "unavailable" || code === "network-request-failed") {
    return `${action} could not reach Firestore. Check the connection, then try again.${detail}`;
  }
  return `${action} failed${code ? ` (${code})` : ""}.${detail}`;
}
function updateDashboardStats() {
  const st = getStats();
  const values = [st.total, st.active, st.soon, st.expired];
  document.querySelectorAll("#dashboardStats .statCard .statValue").forEach((el,i) => el.textContent = values[i]);
}
function getStats() {
  const total = adminMembers.length;
  const active = adminMembers.filter(m => statusOf(m.endDate).label === "Active").length;
  const soon = adminMembers.filter(m => statusOf(m.endDate).daysLeft >= 0 && statusOf(m.endDate).daysLeft <= 7).length;
  const expired = adminMembers.filter(m => statusOf(m.endDate).daysLeft < 0).length;
  return { total, active, soon, expired };
}
function matchesFilter(m) {
  const s = statusOf(m.endDate);
  if (adminFilter === "soon") return s.daysLeft >= 0 && s.daysLeft <= 7;
  if (adminFilter === "expired") return s.daysLeft < 0;
  if (adminFilter === "active") return s.daysLeft >= 0;
  return true;
}
function renderAdminMembers() {
  const listEl = document.getElementById("memberList");
  if (!listEl) return;
  const q = adminSearch.trim().toLowerCase();
  const rows = adminMembers.filter(m => {
    const searchable = `${m.name||""} ${m.phone||""} ${m.plan||""}`.toLowerCase();
    return matchesFilter(m) && (!q || searchable.includes(q));
  }).sort((a,b) => new Date(a.endDate) - new Date(b.endDate));

  if (!rows.length) {
    listEl.innerHTML = `<div class="emptyState">No members match this view.</div>`;
    return;
  }

  listEl.innerHTML = rows.map(m => {
    const s = statusOf(m.endDate);
    const days = s.daysLeft < 0 ? `${Math.abs(s.daysLeft)}d overdue` : `${s.daysLeft}d left`;
    return `
      <div class="memberRow">
        <div class="memberMeta">
          <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHTML(m.name)}</div>
          <div class="miniLine">${escapeHTML(m.phone)} · ${escapeHTML(m.plan)}</div>
          <div class="miniLine" style="margin-top:2px;">Ends ${fmtDate(m.endDate)} · <span style="color:${s.tone};font-weight:700;">${s.label} · ${days}</span></div>
        </div>
        <div class="memberActions">
          <button type="button" class="btn-secondary btn-mini btn-renew" data-action="renew" data-id="${escapeHTML(m.id)}">Renew</button>
          <button type="button" class="btn-secondary btn-mini" data-action="edit" data-id="${escapeHTML(m.id)}">Edit</button>
          <button type="button" class="btn-secondary btn-mini btn-danger" data-action="delete" data-id="${escapeHTML(m.id)}">Delete</button>
        </div>
      </div>`;
  }).join("");

  // Attach handlers after every render so dynamically-created buttons always work.
  listEl.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if (!id || !action) return;
      btn.disabled = true;
      const original = btn.textContent;
      try {
        if (action === "renew") {
          showRenewForm(id);
        } else if (action === "delete") {
          showDeleteConfirmation(id);
        } else if (action === "edit") {
          const m = adminMembers.find(x => String(x.id) === String(id));
          if (m) editMember(m.id, m.name || "", m.phone || "", m.plan || "", m.endDate || "");
        }
      } catch (err) {
        console.error(`Action ${action} failed:`, err);
        const label = action === "renew" ? "Renewal" : action === "delete" ? "Delete" : "Edit";
        showToast(firestoreErrorMessage(label, err), "error");
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>'"]/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
  }[ch]));
}

async function loadMemberList() {
  const listEl = document.getElementById("memberList");
  try {
    const snap = await db.collection("members").orderBy("name").get();
    // Put the Firestore document ID last so a legacy `id` field in document data
    // can never redirect Renew/Delete to a different document.
    adminMembers = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
    updateDashboardStats();
    renderAdminMembers();
  } catch (err) {
    adminMembers = [];
    const message = firestoreErrorMessage("Loading members", err);
    console.error("Loading members failed:", err);
    listEl.innerHTML = `<div class="errorText" style="text-align:center;"></div>`;
    listEl.firstElementChild.textContent = message;
    showToast(message, "error");
  }
}

function addMonthsPreservingDay(isoDate, months) {
  const [y, mo, d] = String(isoDate).split("-").map(Number);
  const target = new Date(y, mo - 1 + months, 1);
  const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(d, lastDay));
  return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,"0")}-${String(target.getDate()).padStart(2,"0")}`;
}

async function renewMember(id, months) {
  const m = adminMembers.find(x => String(x.id) === String(id));
  if (!m) throw new Error("Member not found");
  if (!m.endDate) throw new Error("This member has no membership end date");

  // Renew from the stored expiry, never from an admin-entered start date.
  // For example, 18 Sep + 1 month = 18 Oct; + 2 months = 18 Nov.
  months = Number(months);
  if (!Number.isInteger(months) || months < 1 || months > 24) {
    throw new Error("Enter a whole number of months from 1 to 24");
  }
  const startISO = m.endDate;
  const endISO = addMonthsPreservingDay(startISO, months);

  const data = {
    endDate: endISO,
    phoneClean: cleanPhone(m.phone || ""),
    lastRenewedAt: new Date().toISOString(),
    lastRenewalStart: startISO,
    lastRenewalEnd: endISO
  };

  try {
    const ref = db.collection("members").doc(String(m.id));
    // update() prevents a stale/wrong ID from creating a new member document.
    await ref.update(data);
    const saved = await ref.get({ source: "server" });
    if (!saved.exists || saved.data().endDate !== endISO) {
      throw new Error("Firestore did not confirm the renewed end date");
    }
    await loadMemberList();
    showToast(`Renewed ${m.name} for ${months} month${months === 1 ? "" : "s"}: ${fmtDate(startISO)} → ${fmtDate(endISO)}`);
    return true;
  } catch (err) {
    console.error("Renewal failed:", err);
    throw err;
  }
}

function showRenewForm(id) {
  const m = adminMembers.find(x => String(x.id) === String(id));
  if (!m) { showToast("Member not found. Refresh the list and try again.", "error"); return; }
  const formArea = document.getElementById("formArea");
  formArea.innerHTML = `
    <div class="card" style="margin-top:0;margin-bottom:18px;">
      <div style="font-size:13px;font-weight:800;color:var(--chalk-dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;">Renew membership</div>
      <div class="miniLine">${escapeHTML(m.name || "Member")} · Current end date: <strong>${fmtDate(m.endDate)}</strong></div>
      <label>Renewal length (months)<input id="f_renew_months" type="number" min="1" max="24" step="1" value="1" /></label>
      <div id="renewPreview" class="miniLine" style="margin:-4px 0 12px;"></div>
      <div id="renewError" class="errorText"></div>
      <div style="display:flex;gap:8px;"><button class="btn-primary" style="flex:1;background:linear-gradient(135deg,var(--cyan),#6ec8df);" id="confirmRenewBtn">Confirm renewal</button><button class="btn-secondary" id="cancelRenewBtn">Cancel</button></div>
    </div>`;
  const monthsInput = document.getElementById("f_renew_months");
  const preview = document.getElementById("renewPreview");
  const error = document.getElementById("renewError");
  const updatePreview = () => {
    const months = Number(monthsInput.value);
    if (!Number.isInteger(months) || months < 1 || months > 24) {
      preview.textContent = "Enter a whole number from 1 to 24.";
      return false;
    }
    preview.textContent = `New end date: ${fmtDate(addMonthsPreservingDay(m.endDate, months))}`;
    return true;
  };
  monthsInput.oninput = updatePreview;
  updatePreview();
  document.getElementById("cancelRenewBtn").onclick = () => { formArea.innerHTML = ""; };
  document.getElementById("confirmRenewBtn").onclick = async () => {
    if (!updatePreview()) { error.textContent = "Enter a whole number from 1 to 24."; return; }
    const btn = document.getElementById("confirmRenewBtn");
    btn.disabled = true; btn.textContent = "Renewing…"; error.textContent = "";
    try {
      await renewMember(id, Number(monthsInput.value));
      formArea.innerHTML = "";
    } catch (err) {
      console.error("Renewal failed:", err);
      error.textContent = firestoreErrorMessage("Renewal", err);
      showToast(error.textContent, "error");
      btn.disabled = false; btn.textContent = "Confirm renewal";
    }
  };
}

function showAddForm() { showMemberForm(null); }
function editMember(id, name, phone, plan, endDate) { showMemberForm({ id, name, phone, plan, endDate }); }

function showMemberForm(existing) {
  const isEdit = !!existing;
  document.getElementById("formArea").innerHTML = `
    <div class="card" style="margin-top:0;margin-bottom:18px;">
      <div style="font-size:13px;font-weight:800;color:var(--chalk-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.08em;">${isEdit ? "Edit member" : "New member"}</div>
      <label>Name<input id="f_name" value="${isEdit ? existing.name : ""}" /></label>
      <label>Phone number<input id="f_phone" type="tel" value="${isEdit ? existing.phone : ""}" /></label>
      <label>Plan<input id="f_plan" placeholder="e.g. Monthly Strength Plan" value="${isEdit ? existing.plan : ""}" /></label>
      <label>Membership end date<input id="f_end" type="date" value="${isEdit ? existing.endDate : ""}" /></label>
      <div id="formError" class="errorText"></div>
      <div style="display:flex;gap:8px;"><button class="btn-primary" style="flex:1;background:linear-gradient(135deg,var(--cyan),#6ec8df);" id="saveMemberBtn">${isEdit ? "Save changes" : "Save member"}</button>${isEdit ? `<button class="btn-secondary" id="cancelEditBtn">Cancel</button>` : ""}</div>
    </div>`;
  if (isEdit) document.getElementById("cancelEditBtn").onclick = () => { document.getElementById("formArea").innerHTML = ""; };
  document.getElementById("saveMemberBtn").onclick = async () => {
    const m = { name: document.getElementById("f_name").value.trim(), phone: document.getElementById("f_phone").value.trim(), plan: document.getElementById("f_plan").value.trim(), endDate: document.getElementById("f_end").value };
    const err = document.getElementById("formError");
    if (!m.name || !m.phone || !m.plan || !m.endDate) { err.textContent = "Fill in every field."; return; }
    m.phoneClean = cleanPhone(m.phone);
    const btn = document.getElementById("saveMemberBtn"); btn.textContent = "Saving…"; btn.disabled = true;
    try {
      if (isEdit) await db.collection("members").doc(String(existing.id)).update(m);
      else await db.collection("members").add(m);
      showToast(isEdit ? "Member updated." : "Member added.");
      document.getElementById("formArea").innerHTML = "";
      await loadMemberList();
    } catch (e) {
      console.error("Saving member failed:", e);
      err.textContent = firestoreErrorMessage(isEdit ? "Saving changes" : "Adding member", e);
      showToast(err.textContent, "error");
      btn.textContent = isEdit ? "Save changes" : "Save member";
      btn.disabled = false;
    }
  };
}

async function deleteMember(id) {
  const m = adminMembers.find(x => String(x.id) === String(id));
  if (!m) throw new Error("Member not found");

  try {
    const ref = db.collection("members").doc(String(m.id));
    await ref.delete();
    const deleted = await ref.get({ source: "server" });
    if (deleted.exists) throw new Error("Firestore did not confirm deletion");
    adminMembers = adminMembers.filter(x => String(x.id) !== String(m.id));
    showToast(`${m.name || "Member"} deleted successfully.`);
    await loadMemberList();
    return true;
  } catch (err) {
    console.error("Delete failed:", err);
    throw err;
  }
}

function showDeleteConfirmation(id) {
  const m = adminMembers.find(x => String(x.id) === String(id));
  if (!m) { showToast("Member not found. Refresh the list and try again.", "error"); return; }
  const formArea = document.getElementById("formArea");
  formArea.innerHTML = `
    <div class="card" style="margin-top:0;margin-bottom:18px;">
      <div style="font-size:13px;font-weight:800;color:var(--red);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;">Delete member</div>
      <div class="miniLine">Delete <strong>${escapeHTML(m.name || "this member")}</strong>? This cannot be undone.</div>
      <div id="deleteError" class="errorText"></div>
      <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn-secondary btn-danger" style="flex:1;" id="confirmDeleteBtn">Delete member</button><button class="btn-secondary" id="cancelDeleteBtn">Cancel</button></div>
    </div>`;
  document.getElementById("cancelDeleteBtn").onclick = () => { formArea.innerHTML = ""; };
  document.getElementById("confirmDeleteBtn").onclick = async () => {
    const btn = document.getElementById("confirmDeleteBtn");
    const error = document.getElementById("deleteError");
    btn.disabled = true; btn.textContent = "Deleting…"; error.textContent = "";
    try {
      await deleteMember(id);
      formArea.innerHTML = "";
    } catch (err) {
      console.error("Delete failed:", err);
      error.textContent = firestoreErrorMessage("Delete", err);
      showToast(error.textContent, "error");
      btn.disabled = false; btn.textContent = "Delete member";
    }
  };
}

function exportCSV() {
  if (!adminMembers.length) { showToast("No members to export."); return; }
  const header = ["Name","Phone","Plan","End Date","Status","Days Left"];
  const lines = [header, ...adminMembers.map(m => { const s=statusOf(m.endDate); return [m.name,m.phone,m.plan,m.endDate,s.label,s.daysLeft]; })]
    .map(row => row.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(","));
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`owais-fitness-members-${todayISO()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast("Member list exported.");
}

function setActiveTab(tab) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "member") renderMemberTab(); else renderAdminTab();
}
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (btn) setActiveTab(btn.dataset.tab);
});
setActiveTab("member");
</script>
</body>
